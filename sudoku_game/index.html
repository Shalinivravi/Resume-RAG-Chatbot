<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>
    
    <div class="main-container">
        <header>
            <h1 class="game-title">COSMIC <span class="highlight">SUDOKU</span></h1>
            <div class="game-info">
                <div class="info-item">
                    <span class="label">Diff:</span>
                    <span id="diff-display" class="value">Medium</span>
                </div>
                <div class="info-item">
                    <span class="label">Mistakes:</span>
                    <span id="mistakes-count" class="value">0/3</span>
                </div>
                <div class="info-item">
                    <span class="label">Time:</span>
                    <span id="timer" class="value">00:00</span>
                </div>
            </div>
        </header>

        <div class="game-layout">
            <div id="game-board" class="sudoku-grid">
                <!-- Grid generated by JS -->
            </div>

            <div class="controls-panel">
                <div class="difficulty-selector">
                    <button class="diff-btn" data-level="easy">Easy</button>
                    <button class="diff-btn active" data-level="medium">Medium</button>
                    <button class="diff-btn" data-level="hard">Hard</button>
                </div>

                <div class="numpad">
                    <div class="number-btn" data-number="1">1</div>
                    <div class="number-btn" data-number="2">2</div>
                    <div class="number-btn" data-number="3">3</div>
                    <div class="number-btn" data-number="4">4</div>
                    <div class="number-btn" data-number="5">5</div>
                    <div class="number-btn" data-number="6">6</div>
                    <div class="number-btn" data-number="7">7</div>
                    <div class="number-btn" data-number="8">8</div>
                    <div class="number-btn" data-number="9">9</div>
                </div>

                <div class="action-buttons">
                    <button id="btn-undo" class="action-btn"><i class="fas fa-undo"></i> Undo</button>
                    <button id="btn-erase" class="action-btn"><i class="fas fa-eraser"></i> Erase</button>
                    <button id="btn-hint" class="action-btn"><i class="fas fa-lightbulb"></i> Hint</button>
                    <button id="btn-new-game" class="action-btn primary">New Game</button>
                </div>
            </div>
        </div>
    </div>

    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>UNIVERSE ALIGNED!</h2>
            <p>You completed the grid.</p>
            <p class="final-time">Time: <span id="final-time">00:00</span></p>
            <button id="btn-play-again" class="action-btn primary">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
